org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Java only. Without this, AGP 9 adds org.jetbrains.kotlin:kotlin-stdlib to the
# runtime classpath even though there is no Kotlin source. The option is deprecated
