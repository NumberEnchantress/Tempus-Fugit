plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.tempusfugit.solarclock'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.tempusfugit.solarclock'
        minSdk = 30
        // Google Play requires API 36 for new apps and updates from 31 Aug 2026.
        targetSdk = 36
        versionCode = 2
        versionName = '2.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// No runtime dependencies: no AndroidX, no Material, no AppCompat, no Kotlin stdlib.
dependencies {}
