<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tempus Fugit</title>
  <link rel="stylesheet" href="../shared/clock.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bar">
    <label class="switch"><input type="checkbox" id="location"> location</label>
    <a href="#" id="settings">settings</a>
  </div>
  <div class="clock">
    <canvas class="face" id="face"></canvas>
    <div class="tempus" id="tempus"></div>
    <div class="local" id="local"></div>
    <div class="system" id="system"></div>
    <div class="warning" id="warning" hidden></div>
    <a href="#" id="setup-link" hidden>set up location</a>
    <div class="accuracy" id="accuracy" hidden></div>
    <div class="equation" id="equation"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
